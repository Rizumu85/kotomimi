# Re-runs a release's Mac build that no machine took.
#
# GitHub's macOS arm64 runners are often not to be had: such a job waits fifteen minutes, runs no step, and is
# cancelled with "The job was not acquired by Runner of type hosted even after multiple attempts" (5 of 16 Mac builds
# on 2026-11-04..06, on macos-latest and macos-15 alike; minutes later the same job is usually taken at once). This
# re-runs the failed jobs of that release — the Mac build, and the draft that collects it — up to three times, a few
# minutes apart, and leaves any other failure alone. A re-run asked with this workflow's token starts no new
# workflow_run, so the attempts are made and waited for here, in one job.
name: Kotomimi release retry

on:
  workflow_run:
    workflows: ["Kotomimi release"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  retry:
    name: re-run a Mac build no machine took
    if: startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN: ${{ github.event.workflow_run.id }}
    steps:
      - name: Re-run while the Mac build got no machine
        run: |
          set -euo pipefail
          # The Mac build of the run's latest attempt, where no machine took it: cancelled, no step run, and said so.
          untaken() {
            local attempt job
            attempt=$(gh api "repos/$REPO/actions/runs/$RUN" --jq '.run_attempt')
            job=$(gh api "repos/$REPO/actions/runs/$RUN/attempts/$attempt/jobs" \
              --jq '.jobs[] | select(.name | startswith("build (macOS")) | select(.conclusion == "cancelled") | select((.steps | length) == 0) | .id' | head -n1)
            [ -n "$job" ] || return 1
            gh api "repos/$REPO/check-runs/$job/annotations" --jq '.[].message' | grep -q "not acquired"
          }
          for try in 1 2 3; do
            if ! untaken; then
              echo "The Mac build ran (or failed for another reason): nothing to re-run."
              exit 0
            fi
            echo "No machine took the Mac build: re-running it (try $try of 3) in three minutes."
            sleep 180
            gh run rerun "$RUN" --failed --repo "$REPO"
            # Wait for that attempt to end before looking at it.
            sleep 30
            until [ "$(gh api "repos/$REPO/actions/runs/$RUN" --jq '.status')" = "completed" ]; do sleep 60; done
          done
          if untaken; then
            echo "::warning::No machine took the Mac build in three re-runs: re-run it by hand, or build it on a Mac."
          fi
