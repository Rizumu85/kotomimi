# Fork: Kotomimi's own release. Upstream's `build.yml` signs with upstream's
# certificate and is gated on upstream's repository; this one builds what the
# fork ships — a Windows installer — and gathers it into a DRAFT release for a
# person to read and publish. The macOS build is made on a Mac and added to the
# draft before it is published (`scripts/kotomimi-mac-release.sh`).
#
# To release:
#   1. Set the version in package.json (the fork's scheme: upstream's version
#      with a two-digit build after it — upstream 0.42.2 is 0.42.201, 0.42.202…).
#   2. Commit, then tag that commit `v<version>` and push the tag:
#        git tag -a v0.43.162 -m "Kotomimi 0.43.162" && git push origin v0.43.162
#   3. When the run is green, open the draft under Releases and publish it.
#      The installed app's "Check for updates" reads published releases only.
#
# The tag must be `v<version>`: the app's updater builds its download address
# from it (`electron/update-manager.js`). Upstream's own workflows also listen
# for `v*` tags; they are switched off in this repository's Actions settings.
#
# A manual run (workflow_dispatch) builds everything and uploads the files as
# workflow artifacts, without touching Releases: a rehearsal.
name: Kotomimi release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  # What the app is built with. No analytics key and no extension id: this is
  # not upstream's build, and reports nothing to upstream.
  VITE_BACKEND_URL: https://sokuji-api.kizuna.ai
  VITE_ENVIRONMENT: production
  VITE_ENABLE_KIZUNA_AI: 'true'
  VITE_ENABLE_DEBUG: 'false'

jobs:
  test:
    name: test (the fork's own suites)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      # A tag that does not name the version in package.json would publish an
      # installer whose own version disagrees with its address: refused here.
      - name: The tag is the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi

      # What the fork adds, and the guards that hold it to upstream's rules.
      # Not the whole suite: upstream's has failures of its own that are not
      # this fork's to fix, and a job red on arrival is a job nobody reads.
      # The timeout is four times vitest's own: the guards that read the whole
      # source tree take seconds on a busy runner, and one of them missing 5s by
      # half a second failed a release once (October 2026).
      - name: Run the fork's tests
        run: >-
          npx vitest run --testTimeout=20000
          src/providers
          src/styles
          src/lib/lan
          src/lib/native
          src/lib/windowShape.test.ts
          src/lib/fonts
          src/lib/language
          src/lib/annotate
          src/lib/local-inference
          src/lib/brand.test.ts
          src/components/Annotated
          src/components/Tour
          src/components/SetupWizard
          src/locales
          src/stores/providerStore.test.ts
          src/stores/providerStore.readiness.test.ts
          electron/lan-server.test.js
          electron/lan-firewall.test.js
          electron/lan-discover.test.js
          electron/window-maximize.test.js
          electron/native-engine.test.js
          electron/native-window.test.js
          electron/native-engines.test.js
          electron/autostart.test.js
          electron/squirrel-events.test.js
          electron/model-memory.test.js
          electron/tray.test.js
          electron/mac-keychain.test.js
          electron/apple-speech.test.js
          src/components/TitleBar
          src/components/Settings/ProviderArea.test.tsx
          src/components/LanSharing
          src/components/providers
          src/components/Banner
          src/components/CaptionShare
          src/lib/share
          src/viewer
          electron/caption-share-core.test.js
          electron/caption-share-net.test.js
          electron/caption-share-server.test.js
          electron/caption-share.test.js
          electron/ipc-channels.test.js
          electron/entry-map.consistency.test.js
          scripts/check-docs.test.mjs
          electron/update-payload.test.js
          src/lib/subtitle
          src/components/Display
          src/components/Subtitle
          src/stores/subtitleStore.test.ts
          electron/subtitle-window.test.js
          electron/vrchat.test.js
          electron/audio-host.test.js
          src/app/vrchat.test.ts
          src/lib/audio/capture/stereoSplit.test.ts
          src/services/worklets
          electron/fetch-file.test.js
          electron/mic-users-win.test.js
          electron/model-storage.test.js
          electron/open-guards.test.js
          electron/native-engine-sherpa.test.js
          electron/remote-engine.test.js
          electron/session-recording.test.js
          electron/subtitle-capture.test.js
          electron/update-download.test.js
          electron/update-manager.beta.test.js
          electron/vr-overlay.test.js
          src/app/sessionLags.test.ts
          src/app/sessionRecording.test.ts
          src/app/subtitleCapture.test.ts
          src/app/vrOverlay.test.ts
          src/components/Conversation/ConversationList.correction.test.tsx
          src/components/Conversation/WordFix.test.tsx
          src/components/Fonts
          src/components/MainPanel/MainPanel.tone.test.tsx
          src/components/ModelStorage
          src/components/Settings/sections/ModelManagementSection.fork.test.tsx
          src/components/Tooltip/titleTips.test.ts
          src/components/VRChat
          src/components/dev/SubtitleReplay.test.tsx
          src/lib/audio/capture/micFailure.test.ts
          src/lib/edge-tts
          src/lib/feedback
          src/lib/glossary
          src/lib/modern-audio/ModernAudioRecorder.processing.test.ts
          src/lib/modern-audio/gtcrn
          src/lib/session/retarget.test.ts
          src/lib/theme
          src/lib/view/tone.test.ts
          src/stores/heardByStore.test.ts
          src/stores/nativePlanStore.integration.test.ts
          src/stores/nativePlanStore.test.ts
          src/stores/providerStore.speakBoth.test.ts
          src/stores/settingsStore.theme.test.ts
          src/stores/translatedByStore.test.ts
          src/stores/vrchatStore.test.ts
          src/vr

  windows:
    name: build (Windows)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - name: Build the app
        run: npm run build
        env:
          CI: false

      # The per-application capture helper is built, not committed; packaging
      # without it ships an app that can only capture the whole system.
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Build the capture helper
        run: npm run build:audio-host

      - name: Verify the helper was produced
        shell: bash
        run: test -f resources/bin/win32-x64/sokuji-audio-host.exe

      # Fork: the SteamVR overlay's helper, likewise built (vr-overlay/); its geometry tests run first.
      - name: Build the SteamVR overlay helper
        run: npm run build:vr-overlay

      - name: Verify the overlay helper was produced
        shell: bash
        run: test -f vr-overlay/kotomimi-vr/kotomimi-vr.exe && test -f vr-overlay/kotomimi-vr/openvr_api.dll

      - name: Make the installer
        run: npx electron-forge make --arch=x64
        env:
          CI: false

      - uses: actions/upload-artifact@v6
        with:
          name: windows
          if-no-files-found: error
          path: |
            out/make/squirrel.windows/x64/*Setup*.exe
            out/make/squirrel.windows/x64/*.nupkg
            out/make/squirrel.windows/x64/RELEASES

  release:
    name: draft the release
    # Only for a tag.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v6
        with:
          path: artifacts

      - name: Collect the files
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.exe' -o -name '*.nupkg' -o -name 'RELEASES' \) -exec cp {} release-assets/ \;
          # Squirrel names its files with a space ("Kotomimi-0.43.162 Setup.exe"); the
          # updater asks for the name with a dot, and an address is better without one.
          cd release-assets
          for f in *' '*; do
            [ -e "$f" ] || continue
            mv "$f" "${f// /.}"
          done
          ls -la

      # What "Check for updates" reads: the version, and the installer's name and digest.
      - name: Write latest.yml
        run: |
          EXE_FILE=$(find release-assets -name '*.exe' | head -1)
          EXE_NAME=$(basename "$EXE_FILE")
          VERSION=${GITHUB_REF_NAME#v}
          SHA512=$(openssl dgst -sha512 -binary "$EXE_FILE" | openssl base64 -A)
          SIZE=$(stat -c%s "$EXE_FILE")
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
          {
            echo "version: ${VERSION}"
            echo "files:"
            echo "  - url: ${EXE_NAME}"
            echo "    sha512: ${SHA512}"
            echo "    size: ${SIZE}"
            echo "path: ${EXE_NAME}"
            echo "sha512: ${SHA512}"
            echo "releaseDate: '${DATE}'"
          } > release-assets/latest.yml
          cat release-assets/latest.yml

      # What the release says is also what the app's update dialog shows (`update-manager.js`, `fullChangelog`): the
      # notes written for it, Chinese first, from `release-notes/<tag>.md` in the tagged commit. Without that file,
      # the titles of this repository's own commits since the last release — first-parent and no merges, so an
      # upstream merge brings none of upstream's — less the version commit. The last release is the nearest
      # `v<version>` tag: the history carries other tags too (`native-v*`, `sidecar-v*`, the phone app's `phone-v*`).
      - name: Write the notes
        run: |
          PREVIOUS=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$GITHUB_REF_NAME^" 2>/dev/null || echo "")
          # Fork: the phone app's current installer, as the app itself learns of it (android/scripts/publish.sh).
          PHONE=$(curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/releases/download/phone-latest/phone.json" | jq -r '.apk // empty' 2>/dev/null || true)
          {
            if [ -f "release-notes/${GITHUB_REF_NAME}.md" ]; then
              cat "release-notes/${GITHUB_REF_NAME}.md"
            else
              echo "## 更新内容 / Changes"
              echo
              if [ -n "$PREVIOUS" ]; then
                git log "${PREVIOUS}..${GITHUB_REF_NAME}" --first-parent --no-merges --pretty=format:'- %s' | grep -v -E '^- chore\([a-z]+\): version ' || true
              else
                git log --first-parent --no-merges --pretty=format:'- %s' -n 40 || true
              fi
            fi
            echo
            echo
            echo "## 安装 / Installing"
            echo
            echo "- **Windows**：运行 \`Kotomimi-${GITHUB_REF_NAME#v}.Setup.exe\`。安装程序没有签名，Windows 可能提示“未知发布者”，选择“更多信息 → 仍要运行”。Run the installer; it is not code-signed, so Windows may warn that the publisher is unknown."
            echo "- **macOS（Apple 芯片）**：打开 \`.dmg\`，把 Kotomimi 拖进“应用程序”。应用没有经过公证，第一次请右键点击它并选择“打开”。Not notarized: the first time, right-click the app and choose Open."
            if [ -n "$PHONE" ]; then
              echo "- **安卓手机端（可选）**：把手机借给电脑做识别和翻译，电脑不够快或要同时开游戏时有用。下载 [$(basename "$PHONE")]($PHONE) 装到手机上（Android 9 及以上，要允许安装未知来源的应用），以后它会自己更新。The Android app lends a phone to the computer for recognition and translation; install the APK once, it updates itself."
            fi
            echo
            echo "Kotomimi 是 [Sokuji](https://github.com/kizuna-ai-lab/sokuji) 的独立分支，增加的内容见 [FORK.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/FORK.md)。An independent fork of Sokuji."
          } > NOTES.md
          cat NOTES.md

      - uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          body_path: NOTES.md
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
