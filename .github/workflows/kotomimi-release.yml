# Fork: Kotomimi's own release. Upstream's `build.yml` signs with upstream's
# certificate and is gated on upstream's repository; this one builds what the
# fork ships — a Windows installer, and a macOS build when it can be made —
# and gathers it into a DRAFT release for a person to read and publish.
#
# To release:
#   1. Set the version in package.json (the fork's scheme: upstream's version
#      with a two-digit build after it — upstream 0.42.2 is 0.42.201, 0.42.202…).
#   2. Commit, then tag that commit `v<version>` and push the tag:
#        git tag -a v0.42.225 -m "Kotomimi 0.42.225" && git push origin v0.42.225
#   3. When the run is green, open the draft under Releases and publish it.
#      The installed app's "Check for updates" reads published releases only.
#
# The tag must be `v<version>`: the app's updater builds its download address
# from it (`electron/update-manager.js`). Upstream's own workflows also listen
# for `v*` tags; they are switched off in this repository's Actions settings.
#
# A manual run (workflow_dispatch) builds everything and uploads the files as
# workflow artifacts, without touching Releases: a rehearsal.
name: Kotomimi release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  # What the app is built with. No analytics key and no extension id: this is
  # not upstream's build, and reports nothing to upstream.
  VITE_BACKEND_URL: https://sokuji-api.kizuna.ai
  VITE_ENVIRONMENT: production
  VITE_ENABLE_KIZUNA_AI: 'true'
  VITE_ENABLE_DEBUG: 'false'

jobs:
  test:
    name: test (the fork's own suites)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      # A tag that does not name the version in package.json would publish an
      # installer whose own version disagrees with its address: refused here.
      - name: The tag is the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi

      # What the fork adds, and the guards that hold it to upstream's rules.
      # Not the whole suite: upstream's has failures of its own that are not
      # this fork's to fix, and a job red on arrival is a job nobody reads.
      # The timeout is four times vitest's own: the guards that read the whole
      # source tree take seconds on a busy runner, and one of them missing 5s by
      # half a second failed a release once (October 2026).
      - name: Run the fork's tests
        run: >-
          npx vitest run --testTimeout=20000
          src/providers
          src/lib/lan
          src/lib/windowShape.test.ts
          src/lib/fonts
          src/lib/language
          src/lib/annotate
          src/lib/local-inference
          src/lib/brand.test.ts
          src/components/Annotated
          src/components/Tour
          src/components/SetupWizard
          src/locales
          src/stores/providerStore.test.ts
          src/stores/providerStore.readiness.test.ts
          electron/lan-server.test.js
          electron/lan-firewall.test.js
          electron/lan-discover.test.js
          electron/lan-upstream.test.js
          electron/lan-door.e2e.test.js
          electron/window-maximize.test.js
          electron/local-server.test.js
          electron/local-server.pipelines.test.js
          src/components/TitleBar
          src/components/Settings/ProviderArea.test.tsx
          src/components/LanSharing
          src/components/providers
          electron/ipc-channels.test.js
          electron/entry-map.consistency.test.js
          electron/update-payload.test.js

  windows:
    name: build (Windows)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - name: Build the app
        run: npm run build
        env:
          CI: false

      # The per-application capture helper is built, not committed; packaging
      # without it ships an app that can only capture the whole system.
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Build the capture helper
        run: npm run build:audio-host

      - name: Verify the helper was produced
        shell: bash
        run: test -f resources/bin/win32-x64/sokuji-audio-host.exe

      - name: Make the installer
        run: npx electron-forge make --arch=x64
        env:
          CI: false

      - uses: actions/upload-artifact@v6
        with:
          name: windows
          if-no-files-found: error
          path: |
            out/make/squirrel.windows/x64/*Setup*.exe
            out/make/squirrel.windows/x64/*.nupkg
            out/make/squirrel.windows/x64/RELEASES

  # Not notarized: the fork has no Apple Developer ID, so macOS asks before the
  # first launch. What it can have is a signature that stays the same from one
  # build to the next — a self-signed certificate of the fork's own, kept in two
  # repository secrets:
  #
  #   MACOS_CSC_LINK           the certificate and its key as a .p12, base64
  #   MACOS_CSC_KEY_PASSWORD   the .p12's password
  #
  # With them the app keeps its keychain and microphone permissions across
  # updates (macOS ties both to the signature), and can update itself in place
  # (Squirrel.Mac takes an update only from the same signature): the zip, its
  # blockmap and latest-mac.yml are then published for the updater. Without them
  # the build is ad-hoc signed by its own hook, as before: every update is a new
  # app to macOS, and nothing is published for the updater, which could not
  # install it. Upstream's notes on all of this: docs/build/macos-auto-update.md.
  #
  # Allowed to fail: a release without it is still a release.
  macos:
    name: build (macOS, Apple silicon)
    needs: test
    runs-on: macos-latest
    continue-on-error: true
    env:
      HAS_MAC_CERT: ${{ secrets.MACOS_CSC_LINK != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - name: Build the app
        run: npm run build
        env:
          CI: false

      - name: Build the capture helper
        run: npm run build:audio-host

      # electron-builder finds signing identities with `security find-identity -v`,
      # which does not list a certificate nothing trusts: without this step the
      # build would skip signing and say nothing. Upstream's step, with the
      # fork's certificate name.
      - name: Trust the fork's signing certificate
        if: env.HAS_MAC_CERT == 'true'
        env:
          MACOS_CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          MACOS_CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$MACOS_CSC_LINK" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          # LibreSSL has no -legacy and OpenSSL 3 needs it for a legacy .p12: try plain first.
          openssl pkcs12 -in "$RUNNER_TEMP/signing.p12" -clcerts -nokeys \
            -passin "pass:$MACOS_CSC_KEY_PASSWORD" -out "$RUNNER_TEMP/signing.pem" 2>/dev/null || \
          openssl pkcs12 -legacy -in "$RUNNER_TEMP/signing.p12" -clcerts -nokeys \
            -passin "pass:$MACOS_CSC_KEY_PASSWORD" -out "$RUNNER_TEMP/signing.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$RUNNER_TEMP/signing.pem"
          # Proof that the trust took, the way electron-builder will look.
          SCRATCH="$RUNNER_TEMP/trust-check.keychain"
          security create-keychain -p check "$SCRATCH"
          security unlock-keychain -p check "$SCRATCH"
          security set-keychain-settings "$SCRATCH"
          security import "$RUNNER_TEMP/signing.p12" -k "$SCRATCH" \
            -P "$MACOS_CSC_KEY_PASSWORD" -T /usr/bin/codesign >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k check "$SCRATCH" >/dev/null 2>&1
          security find-identity -v -p codesigning "$SCRATCH" | sed 's/^/  /'
          if ! security find-identity -v -p codesigning "$SCRATCH" | grep -q "Kotomimi Code Signing"; then
            echo "::error::The certificate in MACOS_CSC_LINK is not a valid code-signing identity named 'Kotomimi Code Signing'."
            security delete-keychain "$SCRATCH" || true
            exit 1
          fi
          security delete-keychain "$SCRATCH"
          rm -f "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/signing.pem"

      - name: Make the disk image
        run: |
          set -euo pipefail
          # Exported here, not declared in `env:`: an empty CSC_LINK is not "unset" to electron-builder.
          if [ "$HAS_MAC_CERT" = 'true' ]; then
            export CSC_LINK="$MACOS_CSC_LINK" CSC_KEY_PASSWORD="$MACOS_CSC_KEY_PASSWORD"
          fi
          npx electron-builder --mac dmg zip --arm64 --publish never -c.directories.output=out/make-mac
        env:
          CI: false
          # No certificate: signing is skipped and the build's own hook signs ad hoc.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MACOS_CSC_LINK != '' && 'true' || 'false' }}
          MACOS_CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          MACOS_CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}

      # electron-builder says "skipped macOS code signing" and carries on when it
      # finds no identity: a release that looked signed and was not would break
      # every update after it. Upstream's checks.
      - name: Check the signature and what the updater needs
        if: env.HAS_MAC_CERT == 'true'
        run: |
          set -euo pipefail
          APP=$(find out/make-mac -name 'Kotomimi.app' -maxdepth 3 | head -1)
          [ -n "$APP" ] || { echo "::error::No Kotomimi.app under out/make-mac"; exit 1; }
          DR=$(codesign -d -r- "$APP" 2>&1 | grep 'designated =>' | sed 's/^#* *designated => //')
          echo "designated requirement: $DR"
          case "$DR" in
            *"certificate root = H"*|*"certificate leaf = H"*) echo "OK: pinned to the certificate, the same for every build." ;;
            *) echo "::error::The app is not signed with the certificate (designated requirement: $DR)."; exit 1 ;;
          esac
          codesign --verify --deep --strict "$APP"
          SIGNATURE=$(codesign -dv "$APP" 2>&1)
          grep -Eq 'flags=0x[0-9a-f]+\([^)]*runtime' <<<"$SIGNATURE" || { echo "::error::Not signed with the Hardened Runtime."; exit 1; }
          # Under the Hardened Runtime the microphone is refused, with no question asked, to a bundle without this entitlement.
          for BUNDLE in "$APP" "$APP"/Contents/Frameworks/*.app; do
            ENTITLEMENTS=$(codesign -d --entitlements - "$BUNDLE" 2>/dev/null)
            grep -q 'com.apple.security.device.audio-input' <<<"$ENTITLEMENTS" || { echo "::error::$(basename "$BUNDLE") lacks the audio-input entitlement."; exit 1; }
          done
          ZIP=$(find out/make-mac -maxdepth 1 -name '*.zip' | head -1)
          [ -n "$ZIP" ] || { echo "::error::No .zip: the updater has nothing to install."; exit 1; }
          [ -f out/make-mac/latest-mac.yml ] || { echo "::error::No latest-mac.yml."; exit 1; }
          grep -q "$(basename "$ZIP")" out/make-mac/latest-mac.yml || { echo "::error::latest-mac.yml does not name the zip."; exit 1; }
          cat out/make-mac/latest-mac.yml

      # An ad-hoc build cannot be installed by the updater: nothing is published that would offer it.
      - name: Keep the updater's files out of an unsigned build
        if: env.HAS_MAC_CERT != 'true'
        run: rm -f out/make-mac/latest-mac.yml out/make-mac/*.blockmap

      - uses: actions/upload-artifact@v6
        with:
          name: macos
          if-no-files-found: error
          path: |
            out/make-mac/*.dmg
            out/make-mac/*.zip
            out/make-mac/*.blockmap
            out/make-mac/latest-mac.yml

  release:
    name: draft the release
    # Runs whenever Windows built, with or without macOS — and only for a tag.
    if: always() && needs.windows.result == 'success' && startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v6
        with:
          path: artifacts

      - name: Collect the files
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.exe' -o -name '*.nupkg' -o -name 'RELEASES' -o -name '*.dmg' -o -name '*.zip' -o -name '*.blockmap' -o -name 'latest-mac.yml' \) -exec cp {} release-assets/ \;
          # Squirrel names its files with a space ("Kotomimi-0.42.225 Setup.exe"); the
          # updater asks for the name with a dot, and an address is better without one.
          cd release-assets
          for f in *' '*; do
            [ -e "$f" ] || continue
            mv "$f" "${f// /.}"
          done
          ls -la

      # What "Check for updates" reads: the version, and the installer's name and digest.
      - name: Write latest.yml
        run: |
          EXE_FILE=$(find release-assets -name '*.exe' | head -1)
          EXE_NAME=$(basename "$EXE_FILE")
          VERSION=${GITHUB_REF_NAME#v}
          SHA512=$(openssl dgst -sha512 -binary "$EXE_FILE" | openssl base64 -A)
          SIZE=$(stat -c%s "$EXE_FILE")
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
          {
            echo "version: ${VERSION}"
            echo "files:"
            echo "  - url: ${EXE_NAME}"
            echo "    sha512: ${SHA512}"
            echo "    size: ${SIZE}"
            echo "path: ${EXE_NAME}"
            echo "sha512: ${SHA512}"
            echo "releaseDate: '${DATE}'"
          } > release-assets/latest.yml
          cat release-assets/latest.yml

      # The fork's own commits since the last release: upstream's are upstream's news.
      - name: Write the notes
        run: |
          PREVIOUS=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || echo "")
          {
            echo "Kotomimi ${GITHUB_REF_NAME#v} — an independent fork of [Sokuji](https://github.com/kizuna-ai-lab/sokuji)."
            echo
            echo "What the fork adds is described in [FORK.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/FORK.md)."
            echo
            echo "### Changes"
            if [ -n "$PREVIOUS" ]; then
              git log "${PREVIOUS}..${GITHUB_REF_NAME}" --pretty=format:'- %s' --grep='(fork)' || true
            else
              git log --pretty=format:'- %s' --grep='(fork)' -n 40 || true
            fi
            echo
            echo
            echo "### Installing"
            echo "- **Windows**: run \`Kotomimi-${GITHUB_REF_NAME#v}.Setup.exe\`. Windows may warn that the publisher is unknown: the installer is not code-signed."
            echo "- **macOS (Apple silicon)**: open the \`.dmg\` and drag Kotomimi to Applications. It is not notarized: the first time, right-click the app and choose Open."
          } > NOTES.md
          cat NOTES.md

      - uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          body_path: NOTES.md
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
