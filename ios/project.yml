# The iPad and iPhone app that lends a device to Kotomimi on a computer, as the Android app does (android/).
# XcodeGen makes the Xcode project from this file (`scripts/build.sh` on the Mac); the project itself is not kept.
name: KotomimiNode
options:
  bundleIdPrefix: io.github.rizumu85.kotomimi
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: "YES"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ${KOTOMIMI_TEAM}
    CODE_SIGN_STYLE: Automatic
targets:
  KotomimiNode:
    type: application
    platform: iOS
    sources:
      - path: KotomimiNode
      - path: ../android/app/src/main/assets/selfcheck-ja.wav
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.rizumu85.kotomimi.node
        PRODUCT_NAME: Kotomimi
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: KotomimiNode/Info.plist
    info:
      path: KotomimiNode/Info.plist
      properties:
        CFBundleDisplayName: Kotomimi
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: 让同一 Wi-Fi 下的电脑找到并使用这台设备。
        NSBonjourServices:
          - _kotomimi._tcp
        NSSpeechRecognitionUsageDescription: 用这台设备的语音识别替电脑上的 Kotomimi 听写。
        ITSAppUsesNonExemptEncryption: false
